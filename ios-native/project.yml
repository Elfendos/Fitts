name: FitApp
options:
  bundleIdPrefix: com.fitapp
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: 5.0
targets:
  FitApp:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: FitApp
    resources:
      - path: FitApp/Resources/Assets.xcassets
      - path: FitApp/Resources/Data
      - path: FitApp/Resources/Sounds
      - path: FitApp/Resources/en.lproj
      - path: FitApp/Resources/tr.lproj
    info:
      path: FitApp/Info.plist
      properties:
        CFBundleDisplayName: FitApp
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: "This app uses the camera to take profile photos."
        NSPhotoLibraryUsageDescription: "This app accesses your photo library to select profile photos."
        NSPhotoLibraryAddUsageDescription: "This app saves photos to your photo library."
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: FitApp/Resources/FitApp.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.fitapp.workout
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.developer.ubiquity-kvstore-identifier: "$(TeamIdentifierPrefix)$(CFBundleIdentifier)"
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: com.fitapp.workout
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.10.1"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        DEVELOPMENT_ASSET_PATHS: ""
